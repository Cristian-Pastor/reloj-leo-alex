<!DOCTYPE html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Reloj Temporal Premium</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:20px}.panel{background:#111;border:2px solid #444;border-radius:16px;padding:20px;margin-bottom:20px}.title{text-align:center;color:#ff8c00}.display{background:#000;padding:15px;border-radius:10px;font-family:monospace;font-size:1.2rem;color:#ff6b00;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#101010;border:1px solid #444;border-radius:12px;padding:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class='container'><div class='panel'><h1 class='title'>⚡ RELOJ TEMPORAL LEO & ALEX ⚡</h1><div class='display' id='family'></div></div><div class='grid'><div class='card'><h2>LEO</h2><div id='leo'></div></div><div class='card'><h2>ALEX</h2><div id='alex'></div></div></div></div><script>const leoBirth=new Date('2026-05-14T19:32:00');const alexBirth=new Date('2026-05-14T20:50:00');function ageText(ms){let s=Math.floor(ms/1000);let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return `${d} días · ${h} h · ${m} min · ${s} seg`;}function tick(){const now=new Date();document.getElementById('family').innerHTML='Tiempo desde que llegaron a nuestras vidas<br><br>'+ageText(now-leoBirth);document.getElementById('leo').innerHTML='Edad exacta:<br>'+ageText(now-leoBirth)+'<br><br>Nacimiento: 14/05/2026 19:32';document.getElementById('alex').innerHTML='Edad exacta:<br>'+ageText(now-alexBirth)+'<br><br>Nacimiento: 14/05/2026 20:50';}tick();setInterval(tick,1000);</script></body></html>
